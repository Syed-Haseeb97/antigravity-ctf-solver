[project]
name = "antigravity"
version = "2.0.0"
description = "Antigravity CLI — Hardware-friendly autonomous CTF solver workstation powered by Gemini 3.8 Flash"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "aiodocker>=0.27",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "rich>=14.0",
    "click>=8.1",
    "markdownify>=1.0",
    "pydantic-ai>=2.0",
    "genai-prices>=0.2",
]

[project.scripts]
antigravity = "backend.cli:main"
ag = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "respx>=0.23",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.sources]
"backend" = "backend"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501", "SIM105", "SIM115", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
